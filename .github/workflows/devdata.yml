name: Dev data snapshot (temporary)

on:
  push:
    branches: [claude/eloquent-gauss-g51l74]
    paths: [".github/workflows/devdata.yml"]

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python scripts/sync.py && du -sh site/data site/data/* | sort -h | tail -15
      - run: |
          mkdir -p devdata && tar czf devdata/data.tgz -C site data/meta.json data/visits.json data/pts data/tour data/pm/stats.json data/pm/pm.json data/pm/stops.json data/pm/stations.json data/pm/accidents.json
          ls -la devdata
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devdata && git commit -m "dev data snapshot (temporary)" && git push
